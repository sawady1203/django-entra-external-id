<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Camera Home</title>
</head>
<body>
  <h1>Camera Home Page</h1>
  <p>ログイン済みユーザーのみアクセス可能です。</p>

  {% if user.is_authenticated %}
  <form action="{% url 'oidc_logout' %}" method="post">
    {% csrf_token %}
    <input type="submit" value="logout">
  </form>

  <button id="take-photo">写真を撮る</button>

  <div id="latest-photo">
    {% if latest_photo %}
    <img id="latest-img"
        src="{% url 'photo:photo_serve' %}?id={{ latest_photo.gcs_id }}&t={{ latest_photo.uploaded_at.timestamp }}"
        alt="Latest photo" width="400">
    {% else %}
      <p>まだ写真がありません</p>
    {% endif %}
  </div>

  <div id="loading" style="display:none; margin-top:20px; font-weight:bold; color:blue;"></div>

  <script>
    document.getElementById("take-photo").addEventListener("click", async () => {
      const loadingDiv = document.getElementById("loading");
      const img = document.getElementById("latest-img");
      let count = 0;
      loadingDiv.style.display = "block";
      loadingDiv.textContent = "撮影リクエスト送信中...";

      try {
        // 撮影リクエスト送信
        let res = await fetch("{% url 'camera:take_picture' %}", {
          method: "POST",
          headers: { "X-CSRFToken": "{{ csrf_token }}" }
        });

        if (!res.ok) {
          loadingDiv.textContent = "撮影リクエスト失敗: " + res.statusText;
          return;
        }

        // 撮影依頼成功 → 最新画像取得開始
        loadingDiv.textContent = "撮影成功。最新画像取得中...";
        
        // 取得試行
        const interval = setInterval(async () => {
          count++;
          loadingDiv.textContent = `最新画像取得中... ${count}s`;

          try {
            const latestRes = await fetch("{% url 'photo:latest_photo_api' %}");
            if (!latestRes.ok) return;

            const latestData = await latestRes.json();
            if (latestData.gcs_id) {
              clearInterval(interval);
              img.src = "{% url 'photo:photo_serve' %}?id=" + latestData.gcs_id + "&t=" + new Date().getTime();
              loadingDiv.style.display = "none";
            }
          } catch (e) {
            console.log("最新画像取得エラー", e);
          }

        }, 1000); // 1秒ごとに最新画像確認

      } catch (err) {
        loadingDiv.textContent = "エラーが発生しました: " + err.message;
      }
    });
  </script>
  {% else %}
    <a href="{% url 'oidc_authentication_init' %}">Login</a>
  {% endif %}
</body>
</html>

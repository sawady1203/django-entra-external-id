<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Camera Home</title>
</head>
<body>
  <h1>Camera Home Page</h1>
  <p>ログイン済みユーザーのみアクセス可能です。</p>

  {% if user.is_authenticated %}
  <form action="{% url 'oidc_logout' %}" method="post">
    {% csrf_token %}
    <input type="submit" value="logout">
  </form>

  <button id="take-photo">写真を撮る</button>

  <div id="latest-photo">
    {% if latest_photo %}
    <img id="latest-img"
        src="{% url 'photo:photo_serve' %}?id={{ latest_photo.gcs_id }}&t={{ latest_photo.uploaded_at.timestamp }}"
        alt="Latest photo" width="400">
    {% else %}
      <p>まだ写真がありません</p>
    {% endif %}
  </div>

  <div id="loading" style="display:none; margin-top:20px; font-weight:bold; color:blue;"></div>

  <script>
  document.getElementById("take-photo").addEventListener("click", async () => {
    const loadingDiv = document.getElementById("loading");
    const img = document.getElementById("latest-img");
    loadingDiv.style.display = "block";
    loadingDiv.textContent = "撮影リクエスト中...";

    try {
      const res = await fetch("{% url 'camera:take_picture' %}", {
        method: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
      });
      const data = await res.json();

      if (data.status !== "success") {
        loadingDiv.textContent = "撮影失敗: " + (data.message || "unknown error");
        return;
      }

      // gcs_id を受け取って即更新
      const gcs_id = data.gcs_id;
      const timestamp = new Date().getTime();
      img.src = "{% url 'photo:photo_serve' %}?id=" + gcs_id + "&t=" + timestamp;
      loadingDiv.style.display = "none";

    } catch (err) {
      loadingDiv.textContent = "エラー: " + err.message;
    }
  });
  </script>
  {% else %}
    <a href="{% url 'oidc_authentication_init' %}">Login</a>
  {% endif %}
</body>
</html>

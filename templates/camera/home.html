<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Camera Home</title>
</head>
<body>
  <h1>Camera Home Page</h1>
  <p>ログイン済みユーザーのみアクセス可能です。</p>

  {% if user.is_authenticated %}
  <form action="{% url 'oidc_logout' %}" method="post">
    {% csrf_token %}
    <input type="submit" value="logout">
  </form>

  <button id="take-photo">写真を撮る</button>

  <div id="latest-photo">
    {% if latest_photo %}
      <img id="latest-img"
          src="{% url 'photo:photo_serve' %}?id={{ latest_photo.gcs_id }}&t={{ latest_photo.uploaded_at.timestamp }}"
          alt="Latest photo" width="400">
    {% else %}
      <p>まだ写真がありません</p>
    {% endif %}
  </div>

  <div id="loading" style="display:none; margin-top:20px; font-weight:bold; color:blue;"></div>

  <script>
  document.getElementById("take-photo").addEventListener("click", async () => {
    const loadingDiv = document.getElementById("loading");
    const img = document.getElementById("latest-img");
    loadingDiv.style.display = "block";
    loadingDiv.textContent = "撮影リクエスト送信中...";

    try {
      const res = await fetch("{% url 'camera:take_picture' %}", {
        method: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}" }
      });

      if (!res.ok) {
        loadingDiv.textContent = "撮影リクエスト失敗: " + res.statusText;
        return;
      }

      const data = await res.json();

      if (data.status !== "success" || !data.gcs_id) {
        loadingDiv.textContent = "撮影失敗: " + (data.message || "gcs_id が返ってきません");
        return;
      }

      // 4秒待機して画像反映
      let seconds = 0;
      const waitSeconds = 4;
      loadingDiv.textContent = `画像反映まで ${seconds} 秒`;

      const interval = setInterval(() => {
        seconds++;
        if (seconds <= waitSeconds) {
          loadingDiv.textContent = `画像反映まで ${seconds} 秒`;
        } else {
          clearInterval(interval);

          if (img) {
            img.src = "{% url 'photo:photo_serve' %}?id=" + data.gcs_id + "&t=" + new Date().getTime();
          } else {
            location.reload();
          }
          loadingDiv.style.display = "none";
        }
      }, 1000);

    } catch (err) {
      loadingDiv.textContent = "エラーが発生しました: " + err.message;
    }
  });  
</script>

{% else %}
    <a href="{% url 'oidc_authentication_init' %}">Login</a>
  {% endif %}
</body>
</html>
